<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Assistant V1.3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<h1>Teacher Assistant</h1>
<p class="sub">Say it, snap it, done.</p>

<section class="card hero">
<h2>Universal Command Centre</h2>
<textarea id="commandInput" placeholder="Remind me to email Jason's mother"></textarea>
<div class="row">
<button id="processBtn">Process Command</button>
<button id="voiceBtn">Voice</button>
</div>
<pre id="resultBox">Ready.</pre>
</section>

<section class="card">
<h2>Australian Curriculum V9 Planner</h2>
<div class="grid">
<select>
<option>Music</option><option>English</option><option>Mathematics</option>
<option>Science</option><option>HASS</option>
</select>
<select>
<option>Year 1</option><option>Year 2</option><option>Year 3</option>
<option>Year 4</option><option>Year 5</option><option>Year 6</option>
<option>Year 7</option><option>Year 8</option><option>Year 9</option><option>Year 10</option>
</select>
<input placeholder="Content description code">
<input placeholder="Achievement standard summary">
</div>
</section>

<section class="card">
<h2>Quick Actions</h2>
<div class="row wraprow">
<button class="quick" data-text="Create a lesson plan">Lesson Plan</button>
<button class="quick" data-text="Create a relief lesson">Relief Lesson</button>
<button class="quick" data-text="Create a rubric">Rubric</button>
<button class="quick" data-text="Draft a parent email">Parent Email</button>
</div>
</section>

<section class="card">
<h2>Tasks</h2>
<ul id="taskList"></ul>
</section>
</div>
<script src="script.js"></script>
</body>
</html>
